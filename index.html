<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Topologies of Thoughts</title>
</head>
<body>
  <div id="stage">
    <video id="cam" autoplay playsinline muted></video>
    <div id="vignette"></div>
    <canvas id="gl"></canvas>
    <canvas id="labels"></canvas>
    <div id="hud-line"></div>
    <div id="dot-thumb" class="dot small"></div>
    <div id="dot-idx" class="dot"></div>
    <aside id="panel">
      <h1>Topologies of<br />Thoughts</h1>
      <div id="icon"></div>
      <div id="mode-name"></div>
      <div id="mode-count"></div>
      <div id="mode-info"></div>
      <div id="mode-desc"></div>
    </aside>
    <div id="rail"></div>
    <div id="hint">index + thumb apart / closer = zoom &nbsp;·&nbsp; move hand = orbit / scroll &nbsp;·&nbsp; pinch = next topology &nbsp;·&nbsp; two hands = zoom</div>
    <div id="toast"></div>
    <div id="debug"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
